<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badtz-kai – Leitura Brasileira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700;800&family=Playfair+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Badtz-kai</h1><span>Leitura Brasileira</span></header>
<div class="wrap"><main id="v"></main></div>
<nav aria-label="Navegação principal" id="nav"></nav>
<dialog id="dlg"><form id="f" method="dialog"><h2 id="dt" style="margin-top:0"></h2><div id="df"></div><p class="m" id="de" role="alert" style="color:var(--red)"></p><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn y" id="ok" type="button">Salvar</button><button class="btn o" id="no" type="button">Cancelar</button><button class="btn o" id="alt" type="button" hidden></button></div></form></dialog>
<input type="file" id="pick" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
